# 必须通过 start-services.ps1 或 wiki_app.configuration compose 注入公共配置。
# 固定项目名与卷名，配置迁移不创建另一份数据库或模型缓存。
name: llm-wiki
services:
  postgres:
    image: pgvector/pgvector:pg16
    command: ["postgres", "-p", "${WIKI_DB_INTERNAL_PORT:?请使用统一服务脚本}"]
    environment:
      POSTGRES_DB: ${WIKI_DB_NAME:?请使用统一服务脚本}
      POSTGRES_USER: ${WIKI_DB_USER:?请使用统一服务脚本}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请配置数据库密码}
    ports:
      - "${WIKI_DB_BIND_HOST}:${WIKI_DB_PORT}:${WIKI_DB_INTERNAL_PORT}"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -p ${WIKI_DB_INTERNAL_PORT}"]
      interval: ${WIKI_PG_HEALTH_INTERVAL}s
      timeout: ${WIKI_PG_HEALTH_TIMEOUT}s
      retries: ${WIKI_PG_HEALTH_RETRIES}
    restart: unless-stopped
  bge:
    image: llm-wiki-bge:local
    build:
      context: .
      dockerfile: deploy/Dockerfile.embeddings
    environment:
      WIKI_CONFIG_FILE: /app/config.yaml
      WIKI_RUNTIME: bge
      HF_HOME: ${WIKI_HF_CACHE}
      HF_HUB_DOWNLOAD_TIMEOUT: ${WIKI_DOWNLOAD_TIMEOUT}
      HF_HUB_ETAG_TIMEOUT: ${WIKI_DOWNLOAD_TIMEOUT}
      PYTHONPATH: /app/src
    ports:
      - "${WIKI_BIND_HOST}:${WIKI_BGE_PORT}:${WIKI_MODEL_PORT}"
    volumes:
      - embeddings:/models
      - ${WIKI_CONFIG_SOURCE}:/app/config.yaml:ro
      - ./deploy/embedding_server.py:/app/embedding_server.py:ro
      - ./backend/src/wiki_app/config.py:/app/src/wiki_app/config.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; from wiki_app.config import get_settings; s=get_settings(); urllib.request.urlopen(s.http_url(s.container_host, s.model_http_port) + '/healthz', timeout=s.model_health_request_seconds)"]
      interval: ${WIKI_MODEL_HEALTH_INTERVAL}s
      timeout: ${WIKI_MODEL_HEALTH_TIMEOUT}s
      retries: ${WIKI_MODEL_HEALTH_RETRIES}
    restart: unless-stopped
volumes:
  postgres:
  embeddings:
