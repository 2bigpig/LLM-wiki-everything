# 与 compose.yaml 叠加；宿主机用回环端口，容器间用服务名。
services:
  ocr:
    image: llm-wiki-ocr:latest
    build:
      context: .
      dockerfile: deploy/Dockerfile.inference
      args:
        INFERENCE_KIND: ocr
    environment:
      DATABASE_URL: postgresql+psycopg://wiki:${POSTGRES_PASSWORD:-wiki-local-change-me}@postgres:5432/wiki
      DATA_DIR: /data
      INFERENCE_KIND: ocr
      INFERENCE_DEVICE: cuda
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # 修改服务入口后 restart；每个任务子进程都会读取最新源码。
      PYTHONPATH: /app/src
      PADDLE_PDX_CACHE_HOME: /models/paddlex
      PADDLE_PDX_MODEL_SOURCE: bos
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    ports:
      - "127.0.0.1:8101:8100"
    volumes:
      # 与本地 DATA_DIR 对应同一目录，双方只传相对 storage_key。
      - type: bind
        source: ${DATA_DIR:-./data}
        target: /data
        read_only: true
      - ./backend/src:/app/src:ro
      - ocr-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  asr:
    image: llm-wiki-asr:latest
    build:
      context: .
      dockerfile: deploy/Dockerfile.inference
      args:
        INFERENCE_KIND: asr
    environment:
      DATABASE_URL: postgresql+psycopg://wiki:${POSTGRES_PASSWORD:-wiki-local-change-me}@postgres:5432/wiki
      DATA_DIR: /data
      INFERENCE_KIND: asr
      INFERENCE_DEVICE: cuda
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONPATH: /app/src
      ASR_MODEL: ${ASR_MODEL:-medium}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-int8_float16}
    ports:
      - "127.0.0.1:8102:8100"
    volumes:
      - type: bind
        source: ${DATA_DIR:-./data}
        target: /data
        read_only: true
      - ./backend/src:/app/src:ro
      - asr-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  ocr-models:
  asr-models:
