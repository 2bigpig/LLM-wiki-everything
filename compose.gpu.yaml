# 与 compose.yaml 叠加；普通参数来自公共 YAML，只有数据库密码传入模型服务。
services:
  ocr:
    image: llm-wiki-ocr:latest
    build:
      context: .
      dockerfile: deploy/Dockerfile.inference
      args:
        INFERENCE_KIND: ocr
    environment:
      WIKI_CONFIG_FILE: /app/config.yaml
      WIKI_RUNTIME: ocr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请配置数据库密码}
      INFERENCE_KIND: ocr
      PYTHONPATH: /app/src
      PADDLE_PDX_CACHE_HOME: ${WIKI_OCR_CACHE}
      PADDLE_PDX_MODEL_SOURCE: bos
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    ports:
      - "${WIKI_BIND_HOST}:${WIKI_OCR_PORT}:${WIKI_MODEL_PORT}"
    volumes:
      - type: bind
        source: ${WIKI_DATA_SOURCE}
        target: ${WIKI_DATA_TARGET}
        read_only: true
      - ${WIKI_CONFIG_SOURCE}:/app/config.yaml:ro
      - ./backend/src:/app/src:ro
      - ocr-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  asr:
    image: llm-wiki-asr:latest
    build:
      context: .
      dockerfile: deploy/Dockerfile.inference
      args:
        INFERENCE_KIND: asr
    environment:
      WIKI_CONFIG_FILE: /app/config.yaml
      WIKI_RUNTIME: asr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请配置数据库密码}
      INFERENCE_KIND: asr
      PYTHONPATH: /app/src
      HF_HOME: ${WIKI_HF_CACHE}
      HF_HUB_DOWNLOAD_TIMEOUT: ${WIKI_DOWNLOAD_TIMEOUT}
      HF_HUB_ETAG_TIMEOUT: ${WIKI_DOWNLOAD_TIMEOUT}
    ports:
      - "${WIKI_BIND_HOST}:${WIKI_ASR_PORT}:${WIKI_MODEL_PORT}"
    volumes:
      - type: bind
        source: ${WIKI_DATA_SOURCE}
        target: ${WIKI_DATA_TARGET}
        read_only: true
      - ${WIKI_CONFIG_SOURCE}:/app/config.yaml:ro
      - ./backend/src:/app/src:ro
      - asr-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  ocr-models:
  asr-models:
