[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-wiki-everything"
version = "0.1.0"
description = "可追溯、自动维护的个人知识库"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.38,<2.1", "psycopg[binary,pool]>=3.2,<4",
  "alembic>=1.15,<2", "pydantic-settings>=2.8,<3",
  "PyYAML>=6.0.2,<7", "python-dotenv>=1,<2",
  "tzdata>=2026.6,<2027",
  "langgraph>=1.0,<2", "langgraph-checkpoint-postgres>=3,<4",
  "procrastinate>=3,<4", "pgvector>=0.4,<1",
  "python-multipart>=0.0.20,<1", "httpx>=0.28,<1",
  "openai>=1.65,<3", "trafilatura>=2,<3", "jieba>=0.42.1,<1",
  "pdfplumber>=0.11,<1", "python-docx>=1.1,<2", "pillow>=11,<13",
  "yt-dlp>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
asr = ["faster-whisper>=1.1,<2"]
ocr = ["paddleocr>=3,<4"]
browser = ["playwright>=1.58,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
